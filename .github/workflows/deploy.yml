name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-deploy-retry.mjs
      - run: npm run build
      - run: npm run test:pages
      - run: npm run test:public
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          deploy_log=$(mktemp)
          trap 'rm -f "$deploy_log"' EXIT
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/near-convergence-thesis"
          project_status=$(curl --silent --show-error --retry 2 --max-time 30 --output "$deploy_log" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_url")
          if [ "$project_status" = 404 ]; then
            curl --fail --silent --show-error --retry 2 --max-time 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"name":"near-convergence-thesis","production_branch":"main"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | jq -e '.success == true' >/dev/null
          elif [ "$project_status" != 200 ]; then
            echo "::error::Cloudflare project lookup failed (HTTP $project_status)."
            exit 1
          fi
          for attempt in 1 2 3; do
            status=0
            npx --yes wrangler@4.157.0 pages deploy dist-public --project-name near-convergence-thesis --branch main >"$deploy_log" 2>&1 || status=$?
            cat "$deploy_log"
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|no healthy upstream|upstream connect error' "$deploy_log"; then
              exit "$status"
            fi
            echo "Cloudflare upstream unavailable; retrying deployment (attempt $((attempt + 1))/3)."
            sleep $((attempt * 20))
          done
      - name: Verify live routes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for route in thesis lab research methodology; do
            expected="https://near-convergence-thesis.pages.dev/$route"
            for attempt in {1..10}; do
              actual=$(curl --fail --silent --show-error --location --retry 2 --max-time 15 --output /dev/null --write-out '%{url_effective}' "$expected") || actual=''
              if [ "$actual" = "$expected" ]; then break; fi
              sleep 3
            done
            if [ "$actual" != "$expected" ]; then
              echo "::error::Expected $expected, reached $actual"
              exit 1
            fi
          done
