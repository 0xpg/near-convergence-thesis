name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:pages
      - run: npm run test:public
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes wrangler@4.157.0 pages deploy dist-public --project-name near-evidence --branch main
      - name: Verify live routes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for route in thesis lab research methodology; do
            expected="https://near-evidence.pages.dev/$route"
            actual=$(curl --fail --silent --show-error --location --retry 3 --max-time 30 --output /dev/null --write-out '%{url_effective}' "$expected")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Expected $expected, reached $actual"
              exit 1
            fi
          done
